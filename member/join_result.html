<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>회원가입 완료 (시제품용 가상 페이지)</title>
<style>
  body { margin: 0; font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; background: #F7EEF0; color: #1B1B1F; word-break: keep-all; }
  .mock { max-width: 430px; min-height: 100vh; margin: 0 auto; background: #fff; padding: 56px 20px; text-align: center; box-sizing: border-box; }
  .mock h1 { font-size: 24px; margin: 0 0 8px; }
  .mock p { margin: 0; color: #6B6B73; font-size: 15px; }
  .mock .note { margin-top: 28px; font-size: 12px; color: #9A9AA3; border: 1px dashed #E5BCC8; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="mock">
  <h1>회원가입이 완료됐어요</h1>
  <p>블로즈 회원이 되신 것을 환영해요.</p>
  <p class="note">이 페이지는 시제품 테스트용 가상 가입 완료 화면이에요.<br>실제 카페24에서는 기존 <code>/member/join_result.html</code> 내용은 그대로 두고,<br>아래 표시된 스크립트 한 덩어리만 추가해요.</p>

<!-- ▼▼▼ 블로즈 피부 타입 테스트: 가입 완료 후 결과로 돌아가기 — 여기부터 ▼▼▼
     카페24 /member/join_result.html 맨 아래에 이 덩어리만 그대로 추가한다. -->
<div id="skintest-return" style="display:none;margin:28px auto 0;max-width:390px;padding:22px 18px;border:1px solid #EFE4E7;border-radius:16px;background:#FBEFF2;text-align:center;font-family:inherit;">
  <p style="margin:0 0 4px;font-size:17px;font-weight:700;color:#1B1B1F;">피부 타입 테스트 결과가 준비됐어요</p>
  <p style="margin:0 0 14px;font-size:13.5px;color:#6B6B73;">상세 리포트와 맞춤 루틴을 확인해 보세요.</p>
  <a id="skintest-return-btn" href="/skintest/?unlock=1&amp;joined=1" style="display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#BF1541;color:#fff;font-size:17px;font-weight:700;text-decoration:none;">내 피부 결과 보러 가기</a>
  <p id="skintest-return-auto" style="margin:10px 0 0;font-size:12.5px;color:#9A9AA3;">잠시 후 자동으로 이동해요</p>
</div>
<script>
(function () {
  var KEY = 'blrose_skintest';
  var isCafe24 = /(^|\.)blrose\.co\.kr$/i.test(location.hostname);
  /* 시제품(깃허브 페이지·로컬)에서는 상대 경로 + ?login=1 로 로그인 상태를 흉내 낸다 */
  var TARGET = isCafe24 ? '/skintest/?unlock=1&joined=1' : '../skintest/?unlock=1&joined=1&login=1';
  /* 카페24 메타 연동이 CompleteRegistration 을 이미 보내면 false 로 둔다 (중복 집계 방지) */
  var SEND_COMPLETE_REGISTRATION = false;

  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + KEY + '=([^;]*)'));
    if (m) { try { raw = decodeURIComponent(m[1]); } catch (e) {} }
  }
  if (!raw) return;                       // 테스트를 하지 않고 가입한 사람에게는 아무것도 보여주지 않는다
  var result;
  try { result = JSON.parse(raw); } catch (e) { return; }
  if (!result || !result.type) return;

  if (SEND_COMPLETE_REGISTRATION && window.fbq) {
    window.fbq('track', 'CompleteRegistration', { skin_type: result.type, content_name: 'skintest' });
  }

  var box = document.getElementById('skintest-return');
  document.getElementById('skintest-return-btn').href = TARGET;
  box.style.display = 'block';

  /* 자동 이동은 한 번만 (뒤로가기로 돌아왔을 때 다시 튕기지 않게) */
  var moved = null;
  try { moved = sessionStorage.getItem(KEY + '_returned'); } catch (e) {}
  if (moved) { document.getElementById('skintest-return-auto').style.display = 'none'; return; }
  try { sessionStorage.setItem(KEY + '_returned', '1'); } catch (e) {}
  setTimeout(function () { location.href = TARGET; }, 2000);
})();
</script>
<!-- ▲▲▲ 블로즈 피부 타입 테스트 — 여기까지 ▲▲▲ -->

</div>
</body>
</html>
